spring.application.name=EmployeeCare API

server.port=${SERVER_PORT:9090}

server.servlet.context-path=/api


# ===================================
# POSTGRESQL
# ===================================

spring.datasource.url=jdbc:postgresql://localhost:5432/employeecare_db

spring.datasource.username=${DB_USERNAME}

spring.datasource.password=${DB_PASSWORD}


# ===================================
# JPA / HIBERNATE
# ===================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.open-in-view=false


# ===================================
# FLYWAY
# ===================================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

# ====================================
# CONFIGURATION BREVO
# ====================================

brevo.api.key=${BREVO_API_KEY}

brevo.sender.email=${BREVO_SENDER_EMAIL}

brevo.sender.name=EmployeeCare


# =====================================
# EMPLOYEECARE - FRONTEND
# =====================================

employeecare.frontend.activation-url=http://localhost:3000/activate

# =====================================
# EMPLOYEECARE - JWT
# =====================================

employeecare.jwt.secret=${JWT_SECRET}

employeecare.jwt.issuer=http://localhost:8080/api

employeecare.jwt.access-token-ttl=PT15M


# =====================================
# EMPLOYEECARE - ADMIN BOOTSTRAP
# =====================================

employeecare.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}


# ============================================
# EMPLOYEECARE - PIECES JOINTES
# ============================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

employeecare.attachments.directory=${EMPLOYEECARE_ATTACHMENTS_DIR:./private-data/attachments}

