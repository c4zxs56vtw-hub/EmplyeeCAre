# ===================================
# POSTGRESQL (TEST FALLBACK)
# ===================================
spring.datasource.url=jdbc:postgresql://localhost:5432/employeecare_db
spring.datasource.username=employeecare_user
spring.datasource.password=EmployeeCare2026!

# ===================================
# JPA / FLYWAY
# ===================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===================================
# JWT CONFIGURATION
# ===================================
employeecare.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
employeecare.jwt.issuer=http://localhost:9090/api
employeecare.jwt.access-token-ttl=PT15M

# ===================================
# BREVO DUMMY TEST CONFIG
# ===================================
brevo.api.key=xkeysib-dummy-test-key-0123456789abcdef
brevo.sender.email=noreply@employeecare.local
brevo.sender.name=EmployeeCare Test

# ===================================
# BOOTSTRAP & ATTACHMENTS
# ===================================
employeecare.bootstrap.admin.enabled=false
employeecare.attachments.directory=./target/test-attachments

# ===================================
# TOKEN CLEANUP
# ===================================
employeecare.tokens.cleanup-cron=0 0 * * * *
employeecare.tokens.activation-retention-days=30
